{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="form-card-wrapper">
    <div class="form-card">
        <h1>Edit Article</h1>
        <p class="text-muted">Update your article content and it will be saved immediately.</p>

        <form method="post" class="article-form">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="form-actions">
                <a href="{% url 'article_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
