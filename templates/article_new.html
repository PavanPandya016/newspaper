{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="form-card-wrapper">
    <div class="form-card">
        <h1>Create New Article</h1>
        <p class="text-muted">Write and publish your article. It will be visible to all readers.</p>

        <form method="post" class="article-form">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="form-actions">
                <a href="{% url 'article_list' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Publish Article</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
